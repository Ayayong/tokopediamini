services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: userdb
    volumes:
      - user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productdb
    volumes:
      - product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: orderdb
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: notificationdb
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql://admin:admin123@user-db:5432/userdb
    ports:
      - "8001:8000"
    depends_on:
      user-db:
        condition: service_healthy
    restart: on-failure

  product-service:
    build: ./product-service
    environment:
      DATABASE_URL: postgresql://admin:admin123@product-db:5432/productdb
    ports:
      - "8002:8000"
    depends_on:
      product-db:
        condition: service_healthy
    restart: on-failure

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://admin:admin123@order-db:5432/orderdb
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports:
      - "8003:8000"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: on-failure

  payment-service:
    build: ./payment-service
    environment:
      USER_SERVICE_URL: http://user-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
    ports:
      - "8004:8000"
    depends_on:
      order-service:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql://admin:admin123@notification-db:5432/notificationdb
      USER_SERVICE_URL: http://user-service:8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports:
      - "8005:8000"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    environment:
      USER_URL: http://user-service:8000
      PRODUCT_URL: http://product-service:8000
      ORDER_URL: http://order-service:8000
      PAYMENT_URL: http://payment-service:8000
      NOTIFICATION_URL: http://notification-service:8000
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    restart: on-failure

volumes:
  user-data:
  product-data:
  order-data:
  notification-data: